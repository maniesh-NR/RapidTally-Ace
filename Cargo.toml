[workspace]
resolver = "2"
members = [
    "crates/rapidtally-format",
    "crates/rapidtally-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-or-later"
authors = ["RapidTally Ace Project Contributors"]
repository = "https://github.com/maniesh-NR/RapidTally-Ace"
homepage = "https://github.com/maniesh-NR/RapidTally-Ace"
documentation = "https://github.com/maniesh-NR/RapidTally-Ace/tree/main/docs"

[profile.release]
strip = true
lto = true
codegen-units = 1
